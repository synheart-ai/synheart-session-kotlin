# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# No build cache: CodeQL's Java/Kotlin autobuild restores it, the compile
# tasks come FROM-CACHE, the compiler never runs, and CodeQL sees no code.
org.gradle.caching=false

# Publishing coordinates
GROUP=ai.synheart
POM_ARTIFACT_ID=synheart-session
VERSION_NAME=0.4.0
